version: 2
updates:
  # Keeps pubspec.yaml ranges resolved to current releases; the lockfile is
  # committed, so a bot bump is reviewable like any other change.
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
