<!DOCTYPE html>
<html>
<head>
  <!--
    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build web`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Idle Animals - Extinct-animal idle sanctuary management game.">
  <meta name="theme-color" content="#070E17">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Idle Animals">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Idle Animals - Extinct Sanctuary</title>
  <link rel="manifest" href="manifest.json">
</head>
<body style="background-color: #070E17; margin: 0; padding: 0;">
  <style>
    #boot-loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: #070E17;
      color: #8BA3B8;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 13px;
      letter-spacing: 0.3px;
      z-index: 1;
    }
    #boot-loader .ring {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid #1E3142;
      border-top-color: #38BDF8;
      animation: boot-spin 0.9s linear infinite;
    }
    @keyframes boot-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      #boot-loader .ring { animation: none; border-top-color: #1E3142; }
    }
  </style>
  <div id="boot-loader" role="status" aria-live="polite">
    <div class="ring"></div>
    <span>Restoring sanctuary&hellip;</span>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('boot-loader');
      if (loader) loader.remove();
    });
  </script>
  <!-- Flutter bootstrap loader -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
